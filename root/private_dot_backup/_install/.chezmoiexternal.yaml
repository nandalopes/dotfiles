---
# Freeplane - mind mapping
'freeplane/freeplane.zip':
  url: 'https://sourceforge.net/projects/freeplane/files/latest/download?use_mirror=deac-fra'
  type: 'file'
  refreshPeriod: '360h' # 15 days
'freeplane/changelog.txt':
  # https://www.freeplane.org/changelog
  # https://www.freeplane.org/info/history/history_en.txt
  url: 'https://www.freeplane.org/changelog'
  type: 'file'
  refreshPeriod: '360h' # 15 days
# neovim
'neovim/nvim-linux-x86_64.tar.gz':
  url: "https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz"
  type: 'file'
  refreshPeriod: '360h' # 15 days
# video download helper
'vdhcoapp':
  url: "https://github.com/aclap-dev/vdhcoapp/releases/latest/download/vdhcoapp-linux-x86_64.tar.bz2"
  type: 'archive'
  executable: true
  stripComponents: 1
  refreshPeriod: '168h' # 7 days

{{- $baseVBoxURL := "https://download.virtualbox.org/virtualbox" }}
{{- $version := printf "%s/LATEST-STABLE.TXT" $baseVBoxURL | output "curl" "-fsSL" "--range" "0-500" | trim }}
# VirtualBox
'VirtualBox/Oracle_VirtualBox_Extension_Pack.vbox-extpack':
  url: ' {{- printf "%s/%s/Oracle_VirtualBox_Extension_Pack-%s.vbox-extpack" $baseVBoxURL $version $version -}} '
  type: 'file'
  executable: false
  refreshPeriod: '720h' # 30 days
'VirtualBox/VBoxGuestAdditions.iso':
  url: ' {{- printf "%s/%s/VBoxGuestAdditions_%s.iso" $baseVBoxURL $version $version -}} '
  type: 'file'
  executable: false
  refreshPeriod: '720h' # 30 days
